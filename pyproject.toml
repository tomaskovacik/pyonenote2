[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyonenote2"
version = "0.1.0"
description = "A from-spec reader for OneNote .one/.onetoc2 files (real [MS-ONESTORE]/[MS-FSSHTTPB] object-graph resolution, not a text-run heuristic)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Tomas Kovacik" },
]
keywords = ["onenote", "ms-onestore", "ms-fsshttpb", "parser"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tomaskovacik/pyonenote2"
Issues = "https://github.com/tomaskovacik/pyonenote2/issues"

[project.scripts]
pyonenote2 = "pyonenote2.extract:main"

[tool.setuptools.packages.find]
where = ["src"]
